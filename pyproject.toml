[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-page-pipeline"
version = "3.0.0"
description = "PDF с дореформенной орфографией → OCR по блокам → LLM → review → TXT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Olga Morozova" }]
dependencies = [
  "pymupdf>=1.24.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
cloud = ["gigachat>=0.2.0"]

[project.scripts]
bpp = "bpp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bpp*", "pdf_faithful_corrector*"]

[tool.setuptools.package-data]
pdf_faithful_corrector = ["../web/*", "../assets/**/*"]
